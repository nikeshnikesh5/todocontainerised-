version: "3.9"

services:
  db:
    image: postgres:16
    container_name: todo-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: todo-backend
    env_file: .env
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - todo-network

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: http://todo-backend:5000  # Pass build-time environment variable
    container_name: todo-frontend
    ports:
      - "80:80"   # Exposing the app on port 80
    depends_on:
      - backend
    networks:
      - todo-network

volumes:
  db-data:

networks:
  todo-network:
    driver: bridge